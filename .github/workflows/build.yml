name: 麒麟版打包（Debian 10 归档源 + 自编译 Python，GLIBC 2.28 兼容）

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: arm64v8/debian:10
      options: --user root

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      - name: 配置 Debian 10 归档源并安装依赖
        run: |
          set -ex
          
          # Debian 10 已停止维护，使用官方归档源
          cat > /etc/apt/sources.list << 'SOURCES'
          deb http://archive.debian.org/debian buster main contrib non-free
          deb http://archive.debian.org/debian-security buster/updates main contrib non-free
          deb http://archive.debian.org/debian buster-updates main contrib non-free
          SOURCES
          
          # 允许从归档源获取
          apt-get update -o Acquire::Check-Valid-Until=false -o Acquire::AllowInsecureRepositories=true -qq || true
          apt-get install -y --force-yes --no-install-recommends \
            apt-transport-https ca-certificates
          
          apt-get update -o Acquire::Check-Valid-Until=false -qq

      - name: 安装编译工具链和依赖
        run: |
          set -ex
          
          apt-get install -y -qq --no-install-recommends --allow-unauthenticated \
            build-essential gcc g++ make \
            libssl-dev zlib1g-dev libbz2-dev \
            libreadline-dev libsqlite3-dev \
            libncursesw5-dev libgdbm-dev \
            liblzma-dev tk-dev libffi-dev \
            libopenblas-dev libgfortran5 \
            libx11-dev libxft-dev libxrender-dev \
            libfontconfig1-dev libfreetype6-dev \
            libpng-dev libjpeg-dev \
            git wget ca-certificates \
            libgomp1 libquadmath0 \
            uuid-dev

      - name: 从源码编译 Python 3.8.10
        run: |
          set -ex
          
          cd /tmp
          wget -q https://www.python.org/ftp/python/3.8.10/Python-3.8.10.tar.xz
          tar -xf Python-3.8.10.tar.xz
          cd Python-3.8.10
          
          ./configure \
            --prefix=/opt/python38 \
            --enable-shared \
            --with-ensurepip=install \
            --enable-optimizations \
            LDFLAGS="-Wl,-rpath,/opt/python38/lib"
          
          make -j$(nproc)
          make install
          
          ln -sf /opt/python38/bin/python3 /usr/local/bin/python3
          ln -sf /opt/python38/bin/pip3 /usr/local/bin/pip3
          
          python3 --version

      - name: 安装 Python 依赖
        run: |
          set -ex
          
          pip3 config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          pip3 install --upgrade pip
          pip3 install \
            pyinstaller==5.13.2 \
            pandas==1.5.3 \
            openpyxl==3.1.2 \
            numpy==1.24.3

      - name: PyInstaller 打包
        run: |
          set -ex
          
          PY_FILE=$(ls *.py | head -n 1)
          echo "主文件: $PY_FILE"
          
          /opt/python38/bin/python3 -m PyInstaller \
            --onedir \
            --name "轻松评" \
            --hidden-import pandas \
            --hidden-import openpyxl \
            --hidden-import numpy \
            --hidden-import tkinter \
            --hidden-import tkinter.scrolledtext \
            --hidden-import tkinter.filedialog \
            --hidden-import tkinter.messagebox \
            --hidden-import tkinter.ttk \
            "$PY_FILE"

      - name: 复制所有系统库到 lib/
        run: |
          set -ex
          
          mkdir -p "dist/轻松评/lib"
          
          for lib in \
            /lib/aarch64-linux-gnu/libm.so.6 \
            /lib/aarch64-linux-gnu/libc.so.6 \
            /lib/ld-linux-aarch64.so.1 \
            /lib/aarch64-linux-gnu/libpthread.so.0 \
            /lib/aarch64-linux-gnu/libdl.so.2 \
            /lib/aarch64-linux-gnu/librt.so.1; do
            cp "$lib" "dist/轻松评/lib/" 2>/dev/null || true
          done
          
          for lib in \
            /usr/lib/aarch64-linux-gnu/libopenblas.so.0 \
            /usr/lib/aarch64-linux-gnu/libgomp.so.1 \
            /usr/lib/aarch64-linux-gnu/libquadmath.so.0 \
            /usr/lib/aarch64-linux-gnu/libgfortran.so.5; do
            cp "$lib" "dist/轻松评/lib/" 2>/dev/null || true
          done
          
          for lib in \
            /usr/lib/aarch64-linux-gnu/libtcl8.6.so \
            /usr/lib/aarch64-linux-gnu/libtk8.6.so \
            /usr/lib/aarch64-linux-gnu/libXft.so.2 \
            /usr/lib/aarch64-linux-gnu/libXrender.so.1 \
            /usr/lib/aarch64-linux-gnu/libfontconfig.so.1 \
            /usr/lib/aarch64-linux-gnu/libX11.so.6 \
            /usr/lib/aarch64-linux-gnu/libXext.so.6 \
            /usr/lib/aarch64-linux-gnu/libfreetype.so.6 \
            /usr/lib/aarch64-linux-gnu/libpng16.so.16; do
            cp "$lib" "dist/轻松评/lib/" 2>/dev/null || true
          done
          
          for lib in \
            /lib/aarch64-linux-gnu/liblzma.so.5 \
            /lib/aarch64-linux-gnu/libbz2.so.1.0 \
            /usr/lib/aarch64-linux-gnu/libsqlite3.so.0 \
            /usr/lib/aarch64-linux-gnu/libffi.so.6 \
            /usr/lib/aarch64-linux-gnu/libssl.so.1.1 \
            /usr/lib/aarch64-linux-gnu/libcrypto.so.1.1; do
            cp "$lib" "dist/轻松评/lib/" 2>/dev/null || true
          done
          
          cp /usr/lib/aarch64-linux-gnu/libstdc++.so.6 "dist/轻松评/lib/" 2>/dev/null || true
          
          for lib in \
            /lib/aarch64-linux-gnu/libncursesw.so.6 \
            /lib/aarch64-linux-gnu/libtinfo.so.6 \
            /lib/aarch64-linux-gnu/libreadline.so.7 \
            /lib/aarch64-linux-gnu/libuuid.so.1; do
            cp "$lib" "dist/轻松评/lib/" 2>/dev/null || true
          done
          
          cp /opt/python38/lib/libpython3.8.so.1.0 "dist/轻松评/lib/" 2>/dev/null || true
          
          echo "========== 已打包的库 =========="
          ls -la "dist/轻松评/lib/"

      - name: 生成启动脚本
        run: |
          set -ex
          
          cat > "dist/轻松评/run.sh" << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
          
          if [ -f "$DIR/lib/ld-linux-aarch64.so.1" ]; then
            exec "$DIR/lib/ld-linux-aarch64.so.1" \
              --library-path "$DIR/lib" \
              "$DIR/轻松评" "$@"
          else
            exec "$DIR/轻松评" "$@"
          fi
          EOF
          
          chmod +x "dist/轻松评/run.sh" "dist/轻松评/轻松评"

      - name: 生成快捷方式安装脚本
        run: |
          set -ex
          
          cat > "dist/轻松评/安装桌面快捷方式.sh" << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          DESKTOP_DIR="$HOME/桌面"
          [ ! -d "$DESKTOP_DIR" ] && DESKTOP_DIR="$HOME/Desktop"
          [ ! -d "$DESKTOP_DIR" ] && { echo "找不到桌面目录"; exit 1; }
          
          ICON_LINE=""
          [ -f "$SCRIPT_DIR/icon.png" ] && ICON_LINE="Icon=$SCRIPT_DIR/icon.png"
          
          cat > "$DESKTOP_DIR/轻松评.desktop" << DESKTOP
          [Desktop Entry]
          Type=Application
          Name=轻松评
          Comment=税务数据工具
          Exec=$SCRIPT_DIR/run.sh
          $ICON_LINE
          Terminal=false
          Categories=Office;
          DESKTOP
          
          chmod +x "$DESKTOP_DIR/轻松评.desktop"
          echo "桌面快捷方式已创建"
          EOF
          
          chmod +x "dist/轻松评/安装桌面快捷方式.sh"

      - name: 打包产物
        run: |
          cd dist
          tar -czf ../麒麟版_轻松评_GLIBC228_全库打包.tar.gz 轻松评/
          ls -lh ../麒麟版_轻松评_GLIBC228_全库打包.tar.gz

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 麒麟版-轻松评-GLIBC228-全库打包
          path: 麒麟版_轻松评_GLIBC228_全库打包.tar.gz
