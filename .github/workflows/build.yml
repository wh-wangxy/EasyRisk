name: 麒麟版打包（Ubuntu 20.04 + 完整 GLIBC 自带，隔离系统库）

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: arm64v8/ubuntu:20.04
      options: --user root

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          set -ex
          
          sed -i 's/ports.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
          apt-get update -qq
          
          apt-get install -y -qq --no-install-recommends \
            tzdata \
            python3 python3-pip python3-tk python3-dev \
            binutils file patchelf \
            git

          ln -fs /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          dpkg-reconfigure -f noninteractive tzdata 2>/dev/null || true

          python3 -m pip install --upgrade pip
          pip3 config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          pip3 install pyinstaller==5.13.2 pandas==1.5.3 openpyxl==3.1.2 numpy==1.24.3

      - name: PyInstaller 打包
        run: |
          set -ex
          
          PY_FILE=$(ls *.py | head -n 1)
          echo "主文件: $PY_FILE"
          
          pyinstaller \
            --onedir \
            --name "轻松评" \
            --hidden-import pandas \
            --hidden-import openpyxl \
            --hidden-import numpy \
            --hidden-import tkinter \
            --hidden-import tkinter.scrolledtext \
            --hidden-import tkinter.filedialog \
            --hidden-import tkinter.messagebox \
            --hidden-import tkinter.ttk \
            "$PY_FILE"

      - name: 打包完整 GLIBC 环境
        run: |
          set -ex
          
          mkdir -p "dist/轻松评/lib"
          
          # 复制 Ubuntu 20.04 的完整 GLIBC 库
          cp /lib/aarch64-linux-gnu/ld-linux-aarch64.so.1 "dist/轻松评/lib/"
          cp /lib/aarch64-linux-gnu/libc.so.6 "dist/轻松评/lib/"
          cp /lib/aarch64-linux-gnu/libm.so.6 "dist/轻松评/lib/"
          cp /lib/aarch64-linux-gnu/libpthread.so.0 "dist/轻松评/lib/"
          cp /lib/aarch64-linux-gnu/libdl.so.2 "dist/轻松评/lib/"
          cp /lib/aarch64-linux-gnu/librt.so.1 "dist/轻松评/lib/"
          cp /lib/aarch64-linux-gnu/libresolv.so.2 "dist/轻松评/lib/"
          cp /lib/aarch64-linux-gnu/libnss_files.so.2 "dist/轻松评/lib/"
          cp /lib/aarch64-linux-gnu/libnss_dns.so.2 "dist/轻松评/lib/"
          
          # 复制其他关键库
          for lib in \
            /usr/lib/aarch64-linux-gnu/libstdc++.so.6 \
            /usr/lib/aarch64-linux-gnu/libgcc_s.so.1; do
            cp "$lib" "dist/轻松评/lib/" 2>/dev/null || true
          done
          
          # 复制 Python 共享库
          cp /usr/lib/aarch64-linux-gnu/libpython3.8.so.1.0 "dist/轻松评/lib/" 2>/dev/null || true
          
          # 用 patchelf 修改可执行文件的 interpreter 和 rpath
          patchelf --set-interpreter './lib/ld-linux-aarch64.so.1' --set-rpath '$ORIGIN/lib' "dist/轻松评/轻松评"
          
          # 修改 libpython 的 rpath
          if [ -f "dist/轻松评/lib/libpython3.8.so.1.0" ]; then
            patchelf --set-rpath '$ORIGIN' "dist/轻松评/lib/libpython3.8.so.1.0"
          fi
          
          # 修改所有 .so 文件的 rpath
          find "dist/轻松评" -name "*.so*" -exec patchelf --set-rpath '$ORIGIN/lib:$ORIGIN' {} \; 2>/dev/null || true

      - name: 生成启动脚本
        run: |
          set -ex
          
          cat > "dist/轻松评/run.sh" << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          # 使用打包的 GLIBC 库，完全隔离系统库
          export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
          exec "$DIR/轻松评" "$@"
          EOF
          
          chmod +x "dist/轻松评/run.sh" "dist/轻松评/轻松评"

      - name: 生成快捷方式安装脚本
        run: |
          set -ex
          
          cat > "dist/轻松评/安装桌面快捷方式.sh" << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          DESKTOP_DIR="$HOME/桌面"
          [ ! -d "$DESKTOP_DIR" ] && DESKTOP_DIR="$HOME/Desktop"
          [ ! -d "$DESKTOP_DIR" ] && { echo "找不到桌面目录"; exit 1; }
          
          ICON_LINE=""
          [ -f "$SCRIPT_DIR/icon.png" ] && ICON_LINE="Icon=$SCRIPT_DIR/icon.png"
          
          cat > "$DESKTOP_DIR/轻松评.desktop" << DESKTOP
          [Desktop Entry]
          Type=Application
          Name=轻松评
          Comment=税务数据工具
          Exec=$SCRIPT_DIR/run.sh
          $ICON_LINE
          Terminal=false
          Categories=Office;
          DESKTOP
          
          chmod +x "$DESKTOP_DIR/轻松评.desktop"
          echo "桌面快捷方式已创建"
          EOF
          
          chmod +x "dist/轻松评/安装桌面快捷方式.sh"

      - name: 打包产物
        run: |
          cd dist
          tar -czf ../麒麟版_轻松评_自带GLIBC.tar.gz 轻松评/
          ls -lh ../麒麟版_轻松评_自带GLIBC.tar.gz

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 麒麟版-轻松评-自带GLIBC
          path: 麒麟版_轻松评_自带GLIBC.tar.gz
