name: 麒麟版打包（proot + 迷你根文件系统，完全隔离系统库）

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: arm64v8/ubuntu:20.04
      options: --user root

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          set -ex
          sed -i 's/ports.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            debootstrap binutils git wget file ca-certificates \
            build-essential gcc make libc6-dev \
            pkg-config libtalloc-dev \
            autotools-dev autoconf automake libtool

      - name: 创建迷你根文件系统
        run: |
          set -ex
          mkdir -p rootfs
          debootstrap --variant=minbase --arch=arm64 focal rootfs http://mirrors.aliyun.com/ubuntu-ports
          
          chroot rootfs /bin/bash -c '
            echo "deb http://mirrors.aliyun.com/ubuntu-ports focal main restricted universe multiverse" > /etc/apt/sources.list
            echo "deb http://mirrors.aliyun.com/ubuntu-ports focal-updates main restricted universe multiverse" >> /etc/apt/sources.list
            echo "deb http://mirrors.aliyun.com/ubuntu-ports focal-security main restricted universe multiverse" >> /etc/apt/sources.list
            apt-get update
          '

      - name: 在根文件系统内安装 Python 和依赖
        run: |
          set -ex
          
          chroot rootfs /bin/bash -c '
            apt-get install -y -qq --no-install-recommends \
              python3 \
              python3-venv \
              python3-distutils \
              libpython3.8 \
              libopenblas0-pthread \
              libgomp1 \
              libx11-6 \
              libxft2 \
              libxrender1 \
              libfontconfig1 \
              libfreetype6 \
              libpng16-16 \
              libtcl8.6 \
              libtk8.6 \
              liblzma5 \
              libbz2-1.0 \
              libsqlite3-0 \
              libffi7 \
              libssl1.1 \
              libstdc++6 \
              libncursesw6 \
              libtinfo6 \
              libuuid1 \
              ca-certificates \
              curl \
              fontconfig-config \
              fonts-dejavu-core \
              libx11-data \
              libxcb1 \
              libxdmcp6 \
              libxau6 \
              libbsd0 \
              libexpat1 \
              libkeyutils1 \
              libkrb5-3 \
              libk5crypto3 \
              libcom-err2 \
              libkrb5support0 \
              libgssapi-krb5-2 \
              libidn2-0 \
              libunistring2 \
              libtasn1-6 \
              libnettle7 \
              libhogweed5 \
              libgmp10 \
              libp11-kit0 \
              libzstd1 \
              liblz4-1 \
              libsystemd0 \
              libgcrypt20 \
              libgpg-error0
          '

      - name: 安装 pip 和 Python 包
        run: |
          set -ex
          
          chroot rootfs /bin/bash -c '
            curl -sS https://bootstrap.pypa.io/pip/3.8/get-pip.py -o /tmp/get-pip.py
            python3 /tmp/get-pip.py
            pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
            pip install pandas==1.5.3 openpyxl==3.1.2 numpy==1.24.3
          '

      - name: 复制程序代码到根文件系统
        run: |
          set -ex
          PY_FILE=$(ls *.py | head -n 1)
          cp "$PY_FILE" rootfs/tmp/轻松评.py
          echo "主文件: $PY_FILE"

      - name: 下载并编译 proot
        run: |
          set -ex
          
          update-ca-certificates
          git config --global http.sslVerify false
          
          apt-get install -y -qq libtalloc-dev
          
          git clone --depth=1 https://github.com/proot-me/proot.git
          cd proot
          
          # 查看 src 目录结构
          echo "========== src 目录内容 =========="
          ls -la src/
          echo "========== src 子目录 =========="
          find src/ -type d
          echo "========== src 所有 .c 文件 =========="
          find src/ -name "*.c" | head -30
          echo "=================================="
          
          # 尝试使用 GNUmakefile
          if [ -f src/GNUmakefile ]; then
            echo "使用 src/GNUmakefile"
            make -C src -f GNUmakefile
          elif [ -f src/Makefile ]; then
            echo "使用 src/Makefile"
            make -C src
          else
            echo "手动编译所有 .c 文件"
            cd src
            C_FILES=$(find . -name "*.c")
            echo "找到 .c 文件: $C_FILES"
            INC_DIRS=$(find . -type d | sed 's/^/-I/')
            echo "包含目录: $INC_DIRS"
            gcc -static -o proot \
              $C_FILES \
              $INC_DIRS \
              -ltalloc \
              -lpthread \
              -DHAVE_CONFIG_H
            cd ..
          fi
          
          # 查找并复制编译产物
          echo "========== 查找 proot 可执行文件 =========="
          find . -name "proot" -type f
          find . -name "proot" -type f -executable
          echo "=========================================="
          
          cp $(find . -name "proot" -type f -executable | head -1) ../proot-static
          
          cd ..
          file proot-static
          ldd proot-static 2>/dev/null || true

      - name: 复制 proot 依赖库（如果是动态链接）
        run: |
          set -ex
          
          ldd proot-static 2>/dev/null || true
          
          mkdir -p rootfs/proot-libs
          for lib in $(ldd proot-static 2>/dev/null | grep "=> /" | awk '{print $3}' | sort -u); do
            cp "$lib" rootfs/proot-libs/ 2>/dev/null || true
          done
          
          ls -la rootfs/proot-libs/ 2>/dev/null || true

      - name: 创建启动脚本和打包
        run: |
          set -ex
          
          cat > run.sh << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export PROOT_NO_SECCOMP=1
          
          if [ -d "$DIR/rootfs/proot-libs" ] && [ "$(ls -A "$DIR/rootfs/proot-libs" 2>/dev/null)" ]; then
            export LD_LIBRARY_PATH="$DIR/rootfs/proot-libs:$LD_LIBRARY_PATH"
          fi
          
          "$DIR/proot-static" \
            -r "$DIR/rootfs" \
            -w / \
            -b /dev \
            -b /proc \
            -b /sys \
            -b /tmp \
            -b /home \
            -b /root \
            -b /etc/passwd \
            -b /etc/group \
            -b /etc/localtime \
            -b /etc/resolv.conf \
            -b /etc/hosts \
            -b /run \
            -b /var \
            -b /usr/share/fonts \
            -b /usr/share/themes \
            -b /usr/share/icons \
            -b /usr/share/X11 \
            -b /etc/fonts \
            -b /etc/X11 \
            /usr/bin/python3 /tmp/轻松评.py "$@"
          EOF
          chmod +x run.sh

          cat > 安装桌面快捷方式.sh << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          DESKTOP_DIR="$HOME/桌面"
          [ ! -d "$DESKTOP_DIR" ] && DESKTOP_DIR="$HOME/Desktop"
          [ ! -d "$DESKTOP_DIR" ] && { echo "找不到桌面目录"; exit 1; }
          
          ICON_LINE=""
          [ -f "$SCRIPT_DIR/icon.png" ] && ICON_LINE="Icon=$SCRIPT_DIR/icon.png"
          
          cat > "$DESKTOP_DIR/轻松评.desktop" << DESKTOP
          [Desktop Entry]
          Type=Application
          Name=轻松评
          Comment=税务数据工具
          Exec="$SCRIPT_DIR/run.sh"
          $ICON_LINE
          Terminal=false
          Categories=Office;
          DESKTOP
          
          chmod +x "$DESKTOP_DIR/轻松评.desktop"
          echo "桌面快捷方式已创建"
          EOF
          chmod +x 安装桌面快捷方式.sh

          echo "========== 产物信息 =========="
          ls -la proot-static
          file proot-static
          ls -la rootfs/usr/bin/python3
          du -sh rootfs/
          echo "=============================="

          tar -czf 麒麟版_轻松评_proot完整环境.tar.gz \
            proot-static \
            rootfs/ \
            run.sh \
            安装桌面快捷方式.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 麒麟版-轻松评-proot完整环境
          path: 麒麟版_轻松评_proot完整环境.tar.gz
