name: 麒麟版打包（proot + 迷你根文件系统，完全隔离系统库）

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: arm64v8/ubuntu:20.04
      options: --user root

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      - name: 安装工具和创建根文件系统
        run: |
          set -ex
          
          # 换源
          sed -i 's/ports.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
          apt-get update -qq
          
          # 安装必要工具
          apt-get install -y -qq --no-install-recommends \
            debootstrap binutils git wget

      - name: 创建迷你 Ubuntu 20.04 根文件系统
        run: |
          set -ex
          
          # 创建根文件系统目录
          mkdir -p rootfs
          
          # 使用 debootstrap 创建最小系统
          debootstrap --variant=minbase --arch=arm64 focal rootfs http://mirrors.aliyun.com/ubuntu-ports
          
          # 进入根文件系统，安装 Python 和依赖
          chroot rootfs /bin/bash -c '
            apt-get update
            apt-get install -y --no-install-recommends \
              python3 python3-pip python3-tk \
              libopenblas-base libgomp1 \
              libx11-6 libxft2 libxrender1 libfontconfig1 \
              libfreetype6 libpng16-16 \
              libtcl8.6 libtk8.6 \
              liblzma5 libbz2-1.0 libsqlite3-0 \
              libffi7 libssl1.1 libcrypto1.1 \
              libstdc++6 \
              libncursesw6 libtinfo6 \
              libuuid1 \
              ca-certificates
          '

      - name: 在根文件系统中安装 Python 依赖
        run: |
          set -ex
          
          # 复制你的代码到根文件系统
          cp *.py rootfs/tmp/
          
          chroot rootfs /bin/bash -c '
            pip3 config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
            pip3 install pandas==1.5.3 openpyxl==3.1.2 numpy==1.24.3
          '

      - name: 编译静态链接的 proot
        run: |
          set -ex
          
          # 下载并编译 proot（静态链接）
          git clone https://github.com/proot-me/proot.git
          cd proot
          make STATIC=1
          cp proot ../proot-static
          cd ..

      - name: 创建启动脚本和打包
        run: |
          set -ex
          
          # 创建启动脚本
          cat > run.sh << 'EOF'
          #!/bin/bash
          # 获取脚本所在目录
          DIR="$(cd "$(dirname "$0")" && pwd)"
          
          # 使用 proot 启动迷你环境
          export PROOT_NO_SECCOMP=1
          "$DIR/proot" -r "$DIR/rootfs" -w / -b /dev -b /proc -b /sys -b /tmp -b /home /usr/bin/python3 /tmp/轻松评20260623.py "$@"
          EOF
          chmod +x run.sh

          # 创建快捷方式安装脚本
          cat > 安装桌面快捷方式.sh << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          DESKTOP_DIR="$HOME/桌面"
          [ ! -d "$DESKTOP_DIR" ] && DESKTOP_DIR="$HOME/Desktop"
          [ ! -d "$DESKTOP_DIR" ] && { echo "找不到桌面目录"; exit 1; }
          
          ICON_LINE=""
          [ -f "$SCRIPT_DIR/icon.png" ] && ICON_LINE="Icon=$SCRIPT_DIR/icon.png"
          
          cat > "$DESKTOP_DIR/轻松评.desktop" << DESKTOP
          [Desktop Entry]
          Type=Application
          Name=轻松评
          Comment=税务数据工具
          Exec=$SCRIPT_DIR/run.sh
          $ICON_LINE
          Terminal=false
          Categories=Office;
          DESKTOP
          
          chmod +x "$DESKTOP_DIR/轻松评.desktop"
          echo "桌面快捷方式已创建"
          EOF
          chmod +x 安装桌面快捷方式.sh

          # 打包
          tar -czf 麒麟版_轻松评_proot完整环境.tar.gz \
            proot-static \
            rootfs/ \
            run.sh \
            安装桌面快捷方式.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 麒麟版-轻松评-proot完整环境
          path: 麒麟版_轻松评_proot完整环境.tar.gz
