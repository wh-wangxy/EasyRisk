name: 麒麟版打包（PyInstaller + Ubuntu 20.04 容器，GLIBC兼容）

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: arm64v8/ubuntu:20.04
      options: --user root  # 确保有权限

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          set -ex
          
          # 换源加速
          sed -i 's/ports.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
          apt-get update -qq

          # 安装完整依赖
          apt-get install -y -qq --no-install-recommends \
            python3 python3-pip python3-tk python3-dev \
            binutils file \
            libopenblas-base liblzma5 libbz2-1.0 libreadline8 \
            libsqlite3-0 libncursesw6 libtinfo6 \
            git  # 需要 git 用于 checkout

          # 配置 pip 清华源
          python3 -m pip install --upgrade pip
          pip3 config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          pip3 install pyinstaller pandas openpyxl numpy

      - name: 打包
        run: |
          set -ex
          
          # 自动获取主文件
          PY_FILE=$(ls *.py | head -n 1)
          echo "检测到主文件：$PY_FILE"

          # ========== PyInstaller 打包 ==========
          pyinstaller \
            --onedir \
            --name "轻松评" \
            --hidden-import pandas \
            --hidden-import openpyxl \
            --hidden-import numpy \
            --hidden-import tkinter \
            "$PY_FILE"

          # ========== 复制可能缺失的动态库 ==========
          mkdir -p "dist/轻松评/lib"
          
          for lib in libgomp libquadmath libgfortran libopenblas; do
            find /usr/lib -name "${lib}.so.*" -exec cp {} "dist/轻松评/lib/" \; 2>/dev/null || true
          done
          
          for lib in libtcl libtk libXft libXrender libfontconfig; do
            find /usr/lib -name "${lib}.so.*" -exec cp {} "dist/轻松评/lib/" \; 2>/dev/null || true
          done
          
          for lib in libffi libstdc++ liblzma libbz2 libsqlite3; do
            find /usr/lib -name "${lib}.so.*" -exec cp {} "dist/轻松评/lib/" \; 2>/dev/null || true
          done
          
          find /usr/lib -name "libpython3*.so*" -exec cp {} "dist/轻松评/lib/" \; 2>/dev/null || true

          # ========== 生成启动脚本 run.sh ==========
          cat > "dist/轻松评/run.sh" << "RUN_SCRIPT"
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
          export PYTHONPATH="$DIR:$PYTHONPATH"
          exec "$DIR/轻松评" "$@"
          RUN_SCRIPT
          chmod +x "dist/轻松评/run.sh" "dist/轻松评/轻松评"

          # ========== 生成快捷方式安装脚本 ==========
          cat > "dist/轻松评/安装桌面快捷方式.sh" << "INSTALL_SCRIPT"
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          DESKTOP_DIR="$HOME/桌面"
          [ ! -d "$DESKTOP_DIR" ] && DESKTOP_DIR="$HOME/Desktop"
          if [ ! -d "$DESKTOP_DIR" ]; then
            echo "找不到桌面目录"
            exit 1
          fi
          ICON_LINE=""
          if [ -f "$SCRIPT_DIR/icon.png" ]; then
            ICON_LINE="Icon=$SCRIPT_DIR/icon.png"
          fi
          cat > "$DESKTOP_DIR/轻松评.desktop" << DESKTOP_ENTRY
          [Desktop Entry]
          Type=Application
          Name=轻松评
          Comment=税务数据工具
          Exec=$SCRIPT_DIR/run.sh
          $ICON_LINE
          Terminal=false
          Categories=Office;
          DESKTOP_ENTRY
          chmod +x "$DESKTOP_DIR/轻松评.desktop"
          echo "桌面快捷方式已创建（可手动放入 icon.png 后重新运行本脚本以启用图标）"
          INSTALL_SCRIPT
          chmod +x "dist/轻松评/安装桌面快捷方式.sh"

      - name: 打包产物
        run: |
          cd dist
          tar -czf ../麒麟版_轻松评_PyInstaller_稳定版.tar.gz 轻松评/
          ls -lh ../麒麟版_轻松评_PyInstaller_稳定版.tar.gz

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 麒麟版-PyInstaller-稳定版
          path: 麒麟版_轻松评_PyInstaller_稳定版.tar.gz
