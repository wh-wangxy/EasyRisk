name: 麒麟版打包（proot + 迷你根文件系统，完全隔离系统库）

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: arm64v8/ubuntu:20.04
      options: --user root

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          set -ex
          sed -i 's/ports.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            debootstrap binutils git wget file

      - name: 创建迷你根文件系统
        run: |
          set -ex
          mkdir -p rootfs
          debootstrap --variant=minbase --arch=arm64 focal rootfs http://mirrors.aliyun.com/ubuntu-ports
          
          # 配置完整源（包括 updates 和 security）
          chroot rootfs /bin/bash -c '
            cat > /etc/apt/sources.list << "SOURCES"
            deb http://mirrors.aliyun.com/ubuntu-ports focal main restricted universe multiverse
            deb http://mirrors.aliyun.com/ubuntu-ports focal-updates main restricted universe multiverse
            deb http://mirrors.aliyun.com/ubuntu-ports focal-security main restricted universe multiverse
            SOURCES
            apt-get update
          '

      - name: 在根文件系统内安装 Python 和依赖
        run: |
          set -ex
          
          chroot rootfs /bin/bash -c '
            apt-get install -y -qq --no-install-recommends \
              python3 \
              python3-venv \
              python3-distutils \
              libpython3.8 \
              libopenblas0-pthread \
              libgomp1 \
              libx11-6 \
              libxft2 \
              libxrender1 \
              libfontconfig1 \
              libfreetype6 \
              libpng16-16 \
              libtcl8.6 \
              libtk8.6 \
              liblzma5 \
              libbz2-1.0 \
              libsqlite3-0 \
              libffi7 \
              libssl1.1 \
              libstdc++6 \
              libncursesw6 \
              libtinfo6 \
              libuuid1 \
              ca-certificates \
              curl \
              fontconfig-config \
              fonts-dejavu-core \
              libx11-data \
              libxcb1 \
              libxdmcp6 \
              libxau6 \
              libbsd0
          '

      - name: 安装 pip 和 Python 包
        run: |
          set -ex
          
          chroot rootfs /bin/bash -c '
            curl -sS https://bootstrap.pypa.io/pip/3.8/get-pip.py -o /tmp/get-pip.py
            python3 /tmp/get-pip.py
            pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
            pip install pandas==1.5.3 openpyxl==3.1.2 numpy==1.24.3
          '

      - name: 复制程序代码到根文件系统
        run: |
          set -ex
          # 获取实际的 py 文件名
          PY_FILE=$(ls *.py | head -n 1)
          cp "$PY_FILE" rootfs/tmp/轻松评.py
          echo "主文件: $PY_FILE"

      - name: 编译静态 proot
        run: |
          set -ex
          git clone --depth=1 https://github.com/proot-me/proot.git
          cd proot
          make STATIC=1 || make  # fallback
          file proot  # 验证是否静态链接
          cp proot ../proot-static
          cd ..

      - name: 创建启动脚本和打包
        run: |
          set -ex
          
          # 获取实际的 py 文件名用于脚本
          PY_FILE=$(ls *.py | head -n 1)
          
          cat > run.sh << EOF
          #!/bin/bash
          # 自动获取脚本目录
          DIR="\$(cd "\$(dirname "\$0")" && pwd)"
          export PROOT_NO_SECCOMP=1
          
          # 绑定更多系统目录确保兼容性
          "\$DIR/proot-static" \
            -r "\$DIR/rootfs" \
            -w / \
            -b /dev \
            -b /proc \
            -b /sys \
            -b /tmp \
            -b /home \
            -b /root \
            -b /etc/passwd \
            -b /etc/group \
            -b /etc/localtime \
            -b /etc/resolv.conf \
            -b /etc/hosts \
            -b /run \
            -b /var \
            -b /usr/share/fonts \
            -b /usr/share/themes \
            -b /usr/share/icons \
            -b /usr/share/X11 \
            /usr/bin/python3 /tmp/轻松评.py "\$@"
          EOF
          chmod +x run.sh

          cat > 安装桌面快捷方式.sh << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          DESKTOP_DIR="$HOME/桌面"
          [ ! -d "$DESKTOP_DIR" ] && DESKTOP_DIR="$HOME/Desktop"
          [ ! -d "$DESKTOP_DIR" ] && { echo "找不到桌面目录"; exit 1; }
          
          ICON_LINE=""
          [ -f "$SCRIPT_DIR/icon.png" ] && ICON_LINE="Icon=$SCRIPT_DIR/icon.png"
          
          cat > "$DESKTOP_DIR/轻松评.desktop" << DESKTOP
          [Desktop Entry]
          Type=Application
          Name=轻松评
          Comment=税务数据工具
          Exec="$SCRIPT_DIR/run.sh"
          $ICON_LINE
          Terminal=false
          Categories=Office;
          DESKTOP
          
          chmod +x "$DESKTOP_DIR/轻松评.desktop"
          echo "桌面快捷方式已创建"
          EOF
          chmod +x 安装桌面快捷方式.sh

          # 验证文件
          ls -la proot-static
          ls -la rootfs/usr/bin/python3
          du -sh rootfs/

          tar -czf 麒麟版_轻松评_proot完整环境.tar.gz \
            proot-static \
            rootfs/ \
            run.sh \
            安装桌面快捷方式.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 麒麟版-轻松评-proot完整环境
          path: 麒麟版_轻松评_proot完整环境.tar.gz
